version: '3.8'
services:
  demoapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
      - "8444:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      # OpenTelemetry configuration
      - OTEL_DOTNET_AUTO_HOME=/otel-dotnet-auto
      - OTEL_SERVICE_NAME=DemoApiService1
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://msehd-fdr.middleware.io:443
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=key
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=staging,service.version=1.0.0
      - OTEL_LOG_LEVEL=debug
      - OTEL_DOTNET_AUTO_LOG_DIRECTORY=/app/logs
    volumes:
      - otel-logs:/app/logs

volumes:
  otel-logs: